name: Book source references

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  references:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Check book links, symbols and reviewed sources
        run: python scripts/check_book.py
      - name: Check research editions, preserved evidence and citation metadata
        run: python scripts/check_publications.py
